services:
  web:
    container_name: puyandmbul_web
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_SPOTIFY_PLAYLIST_ID: ${NEXT_PUBLIC_SPOTIFY_PLAYLIST_ID:-63IZYR9lMFKvE0VVl9L2ww}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/dev.db
    volumes:
      - ./data:/app/data
      - ./public/uploads:/app/public/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://127.0.0.1:3000\").then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
